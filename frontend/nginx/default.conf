server {
    listen 8080;
    server_name localhost;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for text assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' http: https: ws: wss:; img-src 'self' data:; font-src 'self' data:;" always;

    # Runtime configuration: served directly from /tmp with no-store
    location = /config.js {
        alias /tmp/config.js;
        add_header Cache-Control "no-store" always;
    }

    # SPA entrypoint: do not cache HTML
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Static assets: immutable 1-year cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # SPA routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
