# Production Override: Architecture A (Scalable Multi-Replica Backend with Edge Gateway)
# Usage:
#   POSTGRES_PASSWORD="secure_prod_password" docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --scale backend=2

services:
  db:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Environment variable POSTGRES_PASSWORD is required in production.}
    ports: !reset []

  backend:
    ports: !reset []
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      SWAGGER_ENABLED: "false"
      RATE_LIMIT_ENABLED: "true"
      METRICS_ENABLED: "true"
      ADMIN_API_KEY: ${ADMIN_API_KEY:?set ADMIN_API_KEY}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      ConnectionStrings__Default: Host=db;Port=5432;Database=school_admission;Username=postgres;Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD};Maximum Pool Size=50

  frontend:
    ports: !reset []
    environment:
      API_URL: /api

  # Edge API Gateway / Reverse Proxy (Architecture A)
  # The ONLY service publishing an external port in production.
  edge:
    image: nginxinc/nginx-unprivileged:alpine
    container_name: school_admission_edge
    init: true
    restart: unless-stopped
    ports:
      - "${PROD_PORT:-80}:8080"
    volumes:
      - ./edge/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
        reservations:
          cpus: "0.2"
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
