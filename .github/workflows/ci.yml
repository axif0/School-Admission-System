name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: school_admission_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore backend/SchoolAdmission.sln

      - name: Build
        run: dotnet build backend/SchoolAdmission.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test backend/SchoolAdmission.sln --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage"
        env:
          ConnectionStrings__Default: "Host=localhost;Port=5432;Database=school_admission_test;Username=postgres;Password=postgrespassword"

      - name: Check for vulnerable NuGet packages
        run: dotnet list backend/src/SchoolAdmission.Api/SchoolAdmission.Api.csproj package --vulnerable --include-transitive

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript & Vite Build
        run: npm run build

      - name: Run Vitest
        run: npm test

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start Compose stack
        run: docker compose up -d --build

      - name: Wait for backend readiness
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:8080/health/ready | grep -q '"status":"ready"'; then
              echo "Backend ready!"
              break
            fi
            echo "Waiting for backend..."
            sleep 2
          done

      - name: Run containerized tests via Compose
        run: |
          docker compose run --rm backend-tests
          docker compose run --rm frontend-tests

      - name: Run contract smoke test
        run: |
          sudo apt-get update && sudo apt-get install -y jq curl
          chmod +x scripts/contract-smoke.sh
          ./scripts/contract-smoke.sh

      - name: Stop Compose stack
        if: always()
        run: docker compose down -v
