services:
  db:
    image: postgres:16-alpine
    container_name: school_admission_db
    command: postgres -c max_connections=200
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-school_admission}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d school_admission"]
      interval: 3s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: final
    container_name: school_admission_backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=school_admission;Username=postgres;Password=postgres;Maximum Pool Size=50
      HOLD_DURATION_SECONDS: ${HOLD_DURATION_SECONDS:-600}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: final
    container_name: school_admission_frontend
    environment:
      API_URL: ${API_URL:-http://localhost:8080}
    ports:
      - "3000:80"
    restart: unless-stopped

  # Bonus: Second backend process running against the same database
  backend2:
    profiles: ["multi"]
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: final
    container_name: school_admission_backend2
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=school_admission;Username=postgres;Password=postgres;Maximum Pool Size=50
      HOLD_DURATION_SECONDS: ${HOLD_DURATION_SECONDS:-600}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "8081:8080"
    restart: unless-stopped

  # Docker-only test runner: backend
  backend-tests:
    profiles: ["test"]
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: test
    depends_on:
      db:
        condition: service_healthy
    environment:
      TEST_ADMIN_CONNECTION_STRING: Host=db;Port=5432;Database=postgres;Username=postgres;Password=postgres
      HOLD_DURATION_SECONDS: 600

  # Docker-only test runner: frontend
  frontend-tests:
    profiles: ["test"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: test

volumes:
  pgdata:
    name: school_admission_pgdata
